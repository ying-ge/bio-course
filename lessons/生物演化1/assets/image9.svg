mily="MyriadPro-Regular,Myriad Pro,Helvetica" x="372.16" y="162.425"><tspan font-size="16"><tspan x="372.16" y="162.425">Draw connections among ideas</tspan></tspan><tspan font-size="12"><tspan x="372.16" y="176.825">differentiate, organize, relate, compare, contrast,</tspan></tspan><tspan font-size="12"><tspan letter-spacing="0em" x="372.16" y="191.225">distinguish, examine, experiment, question, test</tspan></tspan></text><rect x="324.66" y="72.355" width="400" height="65" stroke-width="0" fill="#FDDF71"/><text fill="#1A1A1A" font-family="MyriadPro-Regular,Myriad Pro,Helvetica" x="334.66" y="97.425"><tspan font-size="16"><tspan x="334.66" y="97.425">Justify a stand or decision</tspan></tspan><tspan font-size="12"><tspan x="334.66" y="111.825">appraise, argue, defend, judge, select, support, value,</tspan></tspan><tspan font-size="12"><tspan letter-spacing="0em" x="334.66" y="126.225">critique, weigh</tspan></tspan></text><rect x="287.16" y="7.355" width="437.5" height="65" stroke-width="0" fill="#F58D72"/><text fill="#1A1A1A" font-family="MyriadPro-Regular,Myriad Pro,Helvetica" xml:space="preserve" x="297.16" y="32.425"><tspan x="297.16" y="32.425"><tspan font-size="16">Produce new or original work </tspan></tspan><tspan x="297.16" y="48.6639">design, assemble, construct, develop, formulate, investigate, </tspan><tspan x="297.16" y="63.6639">write, present</tspan></text></g></svg>