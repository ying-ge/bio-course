<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物学发现时间线 · 1859–2026（交互版）</title>
<style>
  :root {
    --evolution: #6A994E; --genetics: #BC4749; --molecule: #2A6F97;
    --diversity: #9C6644; --frontier: #7F5AF0; --cell: #2E86AB;
    --bg: #FAF9F6; --ink: #222;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); overflow: hidden; }

  header { padding: 10px 28px 2px; }
  header h1 { font-size: 22px; font-weight: 700; display: inline; }
  header p  { font-size: 13px; color: #777; margin-top: 2px; }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 4px 28px 0px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

  /* 地图式缩放视窗 */
  #viewport { position: relative; height: calc(100vh - 88px); overflow: hidden;
              cursor: grab; background: var(--bg); }
  #viewport.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; width: 17000px; height: 100%;
           transform-origin: 0 0; will-change: transform; }

  #resetBtn { position: fixed; right: 20px; bottom: 64px; z-index: 60;
              padding: 8px 14px; font-size: 13px; border: 1px solid #c9c5bd;
              border-radius: 20px; background: #fff; color: #555; cursor: pointer;
              box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #resetBtn:hover { background: #efede8; }
  #tourBtn { position: fixed; right: 20px; bottom: 184px; z-index: 60;
             padding: 8px 14px; font-size: 13px; border: 1px solid #c9c5bd;
             border-radius: 20px; background: #fff; color: #555; cursor: pointer;
             box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #tourBtn:hover { background: #efede8; }
  #tourBtn.active { background: #3E5B32; border-color: #3E5B32; color: #fff; font-weight: 700; }
  #qFilterBtn { position: fixed; right: 20px; bottom: 104px; z-index: 60;
                padding: 8px 14px; font-size: 13px; border: 1px solid #c9c5bd;
                border-radius: 20px; background: #fff; color: #555; cursor: pointer;
                box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #qFilterBtn:hover { background: #efede8; }
  #qFilterBtn.active { background: #EEF3EA; border-color: #A9C39A; color: #3E5B32; font-weight: 700; }
  #allTourBtn { position: fixed; right: 20px; bottom: 224px; z-index: 60;
                padding: 8px 14px; font-size: 13px; border: 1px solid #c9c5bd;
                border-radius: 20px; background: #fff; color: #555; cursor: pointer;
                box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #allTourBtn:hover { background: #efede8; }
  #allTourBtn.active { background: #2A6F97; border-color: #2A6F97; color: #fff; font-weight: 700; }
  /* 筛选开启时隐藏无对应标记的事件 */
  body.q-only .event:not([data-q]) { display: none !important; }

  /* 事件密度谱（固定宽度导航条：始终显示完整全景，点击某格缩放至该段） */
  #densityBar { position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
                background: var(--bg); border-top: 1px solid #e5e2da; z-index: 5;
                display: flex; }
  #densityBar .dlabel { flex: 0 0 auto; display: flex; align-items: center;
                        font-size: 12px; color: #999; padding: 0 12px; white-space: nowrap; }
  #densityInner { flex: 1 1 auto; position: relative; height: 100%; }
  #densityInner .bin { position: absolute; top: 0; height: 100%; cursor: pointer; }
  #densityInner .bin:hover { filter: brightness(1.08); }
  #densityInner .bin .y { position: absolute; bottom: 3px; left: 50%;
                          transform: translateX(-50%); font-size: 15px; font-weight: 600;
                          color: #9a9488; pointer-events: none; }
  @media (max-width: 900px)  { #densityInner .bin .y { font-size: 12px; } }
  @media (max-width: 600px)  { #densityInner .bin .y { font-size: 10px; } }
  @media (max-width: 400px)  { #densityInner .bin .y { font-size: 8px; } }
  #densityInner .bin.active .y { color: #111; font-weight: 700; }

  /* 可视区间统计（密度条上方） */
  #viewStats { position: absolute; left: 14px; bottom: 50px; z-index: 6;
               padding: 5px 12px; font-size: 12.5px; color: #555;
               background: rgba(255,255,255,.92); border: 1px solid #e5e2da;
               border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
               white-space: nowrap; }
  #viewStats b { color: #7F5AF0; font-weight: 700; }

  #timeline { position: relative; top: 64px; height: calc(100% - 64px); width: 17000px; }

  /* 主轴 */
  .axis { position: absolute; left: 0; right: 0; top: 52%; height: 3px;
          background: #555; border-radius: 2px; }
  /* 世纪刻度 */
  .tick { position: absolute; top: calc(52% - 7px); width: 1.5px; height: 17px; background: #999; }
  .tick-label { position: absolute; top: calc(52% + 16px); transform: translateX(-50%);
                font-size: 14px; color: #888; }
/* 时代分区（已移除，不再显示） */

  /* 事件节点 */
  .event { position: absolute; transform: translateX(-50%); width: 420px;
           transition: transform .18s ease, z-index 0s; }
  .event .stem { position: absolute; left: 50%; width: 2.5px; background: currentColor; }
  .event .dot  { position: absolute; left: 50%; transform: translate(-50%, -50%);
                 border-radius: 50%; background: currentColor; border: 2px solid #fff;
                 box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: all .18s ease; }
  .event .card { position: absolute; left: 50%; transform: translateX(-50%);
                 width: 420px; text-align: center; transition: all .18s ease; }
  .event .name { font-size: 32px; font-weight: 600; line-height: 1.35; }
  .event .meta { font-size: 22px; color: #888; margin-top: 3px; }
  .event.up    { color: inherit; }
  .event.up .card { bottom: calc(100% - 50%); margin-bottom: 14px; }
  .event.up .stem { bottom: 50%; }
  .event.dn .card { top: calc(100% - 50%); margin-top: 14px; }
  .event.dn .stem { top: 50%; }

  /* 悬停放大：卡与点整体上浮/下沉放大 */
  .event:hover { z-index: 50; }
  .event:hover .dot { transform: translate(-50%, -50%) scale(1.7); }
  .event:hover .name { font-size: 36px; }
  .event:hover .meta { font-size: 25px; color: #555; }
  .event.up:hover .card { margin-bottom: 22px; }
  .event.dn:hover .card { margin-top: 22px; }

  /* 悬停详情气泡 */
  #detailTip { position: fixed; width: 540px; max-width: calc(100vw - 24px);
                   max-height: calc(100vh - 90px); overflow-y: auto;
                   padding: 16px 18px;
                   background: #fff; border-radius: 10px;
                   box-shadow: 0 8px 30px rgba(0,0,0,.18); border-top: 4px solid currentColor;
                   display: none; z-index: 999;
                   opacity: 0; transition: opacity .35s ease; }
  #detailTip.show { opacity: 1; }
  .detail { text-align: left; font-size: 24px; line-height: 1.7;
                   color: #222; }
  .event:hover .detail { opacity: 1; }
  .detail h3 { font-size: 30px; margin-bottom: 6px; }
  .detail h3 a { color: inherit; text-decoration: none; }
  .detail h3 a:hover { text-decoration: underline; }
  .detail .who { color: #999; font-size: 20px; margin-bottom: 8px; }
  .detail .who a { color: #2A6F97; text-decoration: none; border-bottom: 1px dotted #2A6F97; }
  .detail .who a:hover { text-decoration: underline; }
  .detail .darwinq { margin: 2px 0 10px; padding: 10px 12px; background: #EEF3EA;
                 border: 1px solid #A9C39A; border-radius: 8px; font-size: 22px;
                 line-height: 1.6; color: #3E5B32; }
  .detail .darwinq .qtag { display: block; font-weight: 700; color: #4F7A3F; font-size: 18px; margin-bottom: 2px; }
  .detail .darwinq.q2 { background: #F0EDF8; border-color: #A99CC3; color: #3D3560; }
  .detail .darwinq.q2 .qtag { color: #5B4F8A; }
  .detail p { color: #444; }
  .detail .evimg { display: block; width: 60%; margin: 12px auto 0; border-radius: 8px;
                 border: 1px solid #e5e2da; background: #fff; }
  .detail .gossip { margin-top: 10px; padding: 10px 12px; background: #FBF6EC;
                 border: 1px dashed #D4B996; border-radius: 8px; font-size: 21px;
                 line-height: 1.65; color: #6B5B3E; }
  .detail .gossip .gtag { font-weight: 700; color: #B08430; font-size: 18px; margin-bottom: 3px; }
  .detail .src { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd;
                 font-size: 17px; color: #999; }
  .detail .src a { color: #2A6F97; text-decoration: none; }
  .detail .src a:hover { text-decoration: underline; }

  /* 提示条 */
  .hint { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
          background: rgba(40,40,40,.82); color: #fff; font-size: 13.5px;
          padding: 7px 16px; border-radius: 18px; pointer-events: none;
          transition: opacity .5s; }
</style>
</head>
<body>

<header>
  <h1>生物学发现时间线 · 1859–2026</h1>
  <p>📖 = 藏有科学八卦（人物恩怨/命运转折/偶然发现）　🧭 = 达尔文之问（回答他当年无法解答的问题）　🔭 = 时空之旅新问（穿越途中见识新知后继续追问）　|　拖动或滚轮横向滑动 · 悬停查看详情</p>
</header>

<div class="legend">
  <span><i style="background:var(--cell)"></i>细胞篇</span>
  <span><i style="background:var(--genetics)"></i>遗传与变异篇</span>
  <span><i style="background:var(--evolution)"></i>演化生物学</span>
  <span><i style="background:var(--molecule)"></i>分子与基因组</span>
  <span><i style="background:var(--diversity)"></i>多样性与生态</span>
  <span><i style="background:var(--frontier)"></i>前沿技术</span>
</div>

<div id="viewport"><div id="stage"><div id="timeline"><div class="axis"></div></div></div>
<div id="densityBar"><span class="dlabel">事件密度 · 20年/格 · 点击某格缩放到该段</span><div id="densityInner"></div></div>
</div>
<button id="allTourBtn" title="自动导览：按时间顺序飞往每一个事件">▶ 时空之旅</button>
<button id="tourBtn" title="自动导览：按顺序飞往各达尔文之问事件">▶ 达尔文之旅</button>
<button id="qFilterBtn" title="只显示带🧭达尔文之问的事件">🧭 达尔文之问：关</button>
<button id="resetBtn" title="重置为全景视图">⤢ 重置视图</button>
<div id="viewStats">可视区间 <b>—</b> · 事件 <b>—</b></div>
<div class="hint" id="hint">先看全景 → 滚轮缩放（zoom in）→ 放大后按住拖动平移，鼠标悬停事件点查看详情</div>

<script>
// ===== 数据 =====
// cat: cell细胞 / gen遗传 / mol分子 / evo演化 / div多样性 / fro前沿
// lv:  1里程碑(大点粗干) / 2重要(小点细干)
// q:   达尔文之问——本事件回答了他当年无法回答的问题
const EVENTS = [
// —— 前图：细胞与遗传时代（1665–1855 事件已移除，时间线自 1859《物种起源》起）——
{y:1859, n:"《物种起源》出版", w:"查尔斯·达尔文 Charles Darwin", c:"evo", lv:1, q:"一切之旅的起点：自然选择与共同祖先", d:"11 月 24 日伦敦首发 1250 册当天售罄。以自然选择为核心的共同祖先学说，把林奈的分类树变成真实的家谱——两图在此交汇。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Origin_of_Species_title_page.jpg/500px-Origin_of_Species_title_page.jpg", wiki:"https://en.wikipedia.org/wiki/On_the_Origin_of_Species", wikiW:"https://en.wikipedia.org/wiki/Charles_Darwin", wzh:"物种起源", g:`达尔文收到华莱士从马来群岛寄来的论文，发现与自己压了20年的理论几乎相同，几乎精神崩溃。在朋友劝说下，1858年两人的论文被联合宣读——达尔文次年才匆匆出版《物种起源》。华莱士终生自认'达尔文的追随者'，并无怨言。`},
{y:1861, n:"始祖鸟化石", w:"赫尔曼·冯·迈耶 Hermann von Meyer", c:"evo", lv:1, q:"不同大类生物之间，是否存在过渡类型？", d:"《物种起源》出版仅两年，巴伐利亚石灰岩矿中出土兼具羽毛与爬行动物特征（长尾、有爪、有齿）的始祖鸟——达尔文预言的'中间类型'如期现身。后来中国辽宁的带羽毛恐龙化石进一步补全了鸟类起源的证据链。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Archaeopteryx_lithographica_%28Berlin_specimen%29.jpg/500px-Archaeopteryx_lithographica_%28Berlin_specimen%29.jpg", wiki:"https://en.wikipedia.org/wiki/Archaeopteryx", wikiW:"https://en.wikipedia.org/wiki/Hermann_von_Meyer", wzh:"始祖鸟", g:`达尔文在《物种起源》里坦承'没有发现的中间变种'是理论最大的软肋。始祖鸟标本恰恰在他最需要的时候出现——恩格斯说它是'爬行类向鸟类过渡的完美证据'，反对者则坚称它'要么是鸟要么是爬虫'，争论持续至今。`},
{y:1865, n:"遗传定律（被埋没）", w:"格雷戈尔·孟德尔 Gregor Mendel", c:"gen", lv:1, q:"亲代的性状究竟怎样传给后代？", d:"孟德尔在布尔诺自然学会宣读豌豆实验论文：分离定律与自由组合定律。此后 35 年无人问津——直到 1900 年三人独立重发现。达尔文至死不知孟德尔。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Gregor_Mendel_2.jpg/500px-Gregor_Mendel_2.jpg", wiki:"https://en.wikipedia.org/wiki/Mendelian_inheritance", wikiW:"https://en.wikipedia.org/wiki/Gregor_Mendel", wzh:"孟德尔", g:`孟德尔的论文重印本躺在达尔文书房里，据说页边还有记号，但两人从未通信——历史学家至今争论达尔文是否真的读懂了它。若他注意到'粒子遗传'，进化论可能提前30年补上机制。`},
{y:1869, n:"发现'核素'（DNA）", w:"弗里德里希·米舍尔 Friedrich Miescher", c:"mol", lv:2, q:"遗传信息的化学本质是什么？", d:"米舍尔从脓细胞（手术绷带）中分离出一种只存在于细胞核中的酸性物质，命名为'核素'——后来知道这就是 DNA。当时没人想到这个'单调'的分子竟是遗传的主角。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Friedrich_Miescher.jpg/500px-Friedrich_Miescher.jpg", wiki:"https://en.wikipedia.org/wiki/DNA", wikiW:"https://en.wikipedia.org/wiki/Friedrich_Miescher", wzh:"米舍尔"},
{y:1879, n:"看见有丝分裂", w:"瓦尔特·弗莱明 Walther Flemming", c:"cell", lv:2, q:"遗传信息在细胞中以什么形式存在？", d:"弗莱明用苯胺染料染色，首次系统描述细胞分裂中'染色质'的纵裂与均分过程（有丝分裂）。1888 年瓦尔代尔将其命名为 chromosome（染色体）——遗传问题从此进入细胞内部寻找答案。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Animal_cell_cycle-en.svg/500px-Animal_cell_cycle-en.svg.png", wiki:"https://en.wikipedia.org/wiki/Mitosis", wikiW:"https://en.wikipedia.org/wiki/Walther_Flemming", wzh:"弗莱明"},
{y:1866, n:"海克尔系统树与生态学", w:"恩斯特·海克尔 Ernst Haeckel", c:"div", lv:2, d:"海克尔绘制通用系统发生树、创造'生态学'(Ökologie)一词，并把达尔文思想推向德国。'系统发生'概念从此与演化绑定。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Ernst_Haeckel_5.jpg/500px-Ernst_Haeckel_5.jpg", wiki:"https://en.wikipedia.org/wiki/Phylogenetic_tree", wikiW:"https://en.wikipedia.org/wiki/Ernst_Haeckel", wzh:"海克尔"},
{y:1876, n:"发现细胞呼吸", w:"普费弗等", c:"cell", lv:2, d:"普费弗等开始用实验研究活细胞的呼吸与渗透，细胞生理学从描述走向定量。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/CellRespiration.svg/500px-CellRespiration.svg.png", wiki:"https://en.wikipedia.org/wiki/Cellular_respiration", wikiW:"https://en.wikipedia.org/wiki/Wilhelm_Pfeffer", wzh:"细胞呼吸"},
{y:1897, n:"发现酶与发酵", w:"爱德华·毕希纳 Eduard Buchner", c:"cell", lv:2, d:"毕希纳用无细胞酵母汁实现糖发酵，证明发酵不需完整活细胞——'酿酶'的发现为酶学打开大门，他因此获 1907 年诺贝尔化学奖。", wiki:"https://en.wikipedia.org/wiki/Zymase", wikiW:"https://en.wikipedia.org/wiki/Eduard_Buchner", wzh:"毕希纳"},
{y:1898, n:"发现高尔基体", w:"卡米洛·高尔基 Camillo Golgi", c:"cell", lv:2, d:"高尔基用银染法在神经细胞内显示出网状细胞器，后来以他命名。细胞器的精细世界在 20 世纪电镜时代才真正展开。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/XBio_illustration_%E2%80%93_Golgi_Apparatus.png/500px-XBio_illustration_%E2%80%93_Golgi_Apparatus.png", wiki:"https://en.wikipedia.org/wiki/Golgi_apparatus", wikiW:"https://en.wikipedia.org/wiki/Camillo_Golgi", wzh:"高尔基体"},
{y:1900, n:"孟德尔定律重发现", w:"德弗里斯 de Vries / 柯伦斯 Correns / 丘谢马克 Tschermak", c:"gen", lv:1, q:"自然选择所依赖的性状如何遗传？", d:"三人各自独立实验后几乎同时读到孟德尔 1865 年论文，遗传学在此刻正式诞生——科学史上著名的'多重独立发现'。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/XBio_illustration_%E2%80%93_Mendelian_Inheritance.png/500px-XBio_illustration_%E2%80%93_Mendelian_Inheritance.png", wiki:"https://en.wikipedia.org/wiki/Mendelian_inheritance", wikiW:"https://en.wikipedia.org/wiki/Hugo_de_Vries", wzh:"孟德尔定律"},
{y:1903, n:"突变与基因型概念", w:"德弗里斯 de Vries / 威廉·约翰森 Wilhelm Johannsen", c:"gen", lv:2, q:"自然选择所筛选的变异从哪里来？", d:"德弗里斯发表月见草突变研究，提出新性状可不连续地突然出现；约翰森 1909 年提出'基因型/表现型'术语，把遗传因子与可见性状分开。达尔文时代' blending inheritance 会抹平差异'的致命反对理由从此瓦解。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Hugo_de_Vries_%281848-1935%29%2C_by_Th%C3%A9r%C3%A8se_Schwartze_%281851-1918%29.jpg/500px-Hugo_de_Vries_%281848-1935%29%2C_by_Th%C3%A9r%C3%A8se_Schwartze_%281851-1918%29.jpg", wiki:"https://en.wikipedia.org/wiki/Mutationism", wikiW:"https://en.wikipedia.org/wiki/Wilhelm_Johannsen", wzh:"突变论"},
{y:1902, n:"染色体与遗传的联系", w:"沃尔特·萨顿 Walter Sutton / 特奥多尔·鲍维里 Theodor Boveri", c:"gen", lv:2, d:"他们注意到减数分裂中染色体的行为与孟德尔因子完全平行，提出遗传的染色体学说——基因从此有了实体载体（还未命名）。", img:"https://upload.wikimedia.org/wikipedia/commons/8/89/Theodor_boveri_walter_sutton.png", wiki:"https://en.wikipedia.org/wiki/Boveri%E2%80%93Sutton_chromosome_theory", wikiW:"https://en.wikipedia.org/wiki/Walter_Sutton_(geneticist)", wzh:"鲍维里"},
{y:1908, n:"哈迪-温伯格平衡", w:"戈弗雷·哈迪 G. H. Hardy / 威廉·温伯格 Wilhelm Weinberg", c:"gen", lv:2, d:"数学家哈迪与医生温伯格各自证明：无选择、无漂变、随机交配下基因频率保持不变——群体遗传学的理论基石，也是今天 R 建树与中性理论的前奏。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Hardy-Weinberg.svg/500px-Hardy-Weinberg.svg.png", wiki:"https://en.wikipedia.org/wiki/Hardy%E2%80%93Weinberg_principle", wikiW:"https://en.wikipedia.org/wiki/G._H._Hardy", wzh:"哈代-温伯格定律"},
{y:1910, n:"基因在染色体上", w:"托马斯·摩尔根 Thomas Hunt Morgan", c:"gen", lv:1, d:"摩尔根用果蝇白眼突变证明基因位于染色体上，并提出连锁与交换（遗传第三定律），1933 年获诺贝尔奖。基因从抽象符号变成染色体上的实体。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Thomas_Hunt_Morgan.jpg/500px-Thomas_Hunt_Morgan.jpg", wiki:"https://en.wikipedia.org/wiki/Genetic_linkage", wikiW:"https://en.wikipedia.org/wiki/Thomas_Hunt_Morgan", wzh:"摩尔根"},
{y:1927, n:"X 射线人工诱变", w:"赫尔曼·穆勒 Hermann Muller", c:"gen", lv:2, q:"可遗传变异从哪里来？", d:"穆勒证明 X 射线可使果蝇突变率提高上百倍——变异并非凭空产生，物理/化学因素即可诱发。自然选择不创造变异，只筛选已有可遗传差异；突变与重组是变异之源。1946 年诺贝尔奖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Brokechromo.jpg/500px-Brokechromo.jpg", wiki:"https://en.wikipedia.org/wiki/Mutagenesis", wikiW:"https://en.wikipedia.org/wiki/Hermann_Josef_Muller", wzh:"穆勒"},
{y:1937, n:"现代综合进化论", w:"费奥多西·杜布赞斯基 Theodosius Dobzhansky", c:"evo", lv:1, side:1, d:"《遗传学与物种起源》把群体遗传学与达尔文选择论融合：自然选择作用于种群内的等位基因频率——'达尔文+孟德尔'的现代综合运动由此启动，迈尔、赫胥黎、辛普森等相继完成。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Modern_Synthesis.svg/500px-Modern_Synthesis.svg.png", wiki:"https://en.wikipedia.org/wiki/Modern_synthesis_(20th_century)", wikiW:"https://en.wikipedia.org/wiki/Theodosius_Dobzhansky", wzh:"现代综合进化论"},
{y:1942, n:"物种的生物学概念", w:"恩斯特·迈尔 Ernst Mayr", c:"evo", lv:2, d:"迈尔系统提出以生殖隔离为核心的物种概念，并推动'现代综合'的动物学部分。物种不再只是形态相似，而是'实际上或潜在可相互交配的自然群体'。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Ernst_Mayr_PLoS.jpg/500px-Ernst_Mayr_PLoS.jpg", wiki:"https://en.wikipedia.org/wiki/Species_problem", wikiW:"https://en.wikipedia.org/wiki/Ernst_Mayr", wzh:"恩斯特·迈尔"},
{y:1944, n:"DNA 是遗传物质", w:"奥斯瓦尔德·艾弗里 Oswald Avery", c:"mol", lv:2, side:-1, d:"艾弗里等纯化肺炎链球菌的转化因子，证明是 DNA 而非蛋白质——但当时无人敢信，'如此单调的分子怎么携带遗传信息？'", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/DNA_in_water.jpg/500px-DNA_in_water.jpg", wiki:"https://en.wikipedia.org/wiki/Avery%E2%80%93MacLeod%E2%80%93McCarty_experiment", wikiW:"https://en.wikipedia.org/wiki/Oswald_Avery", wzh:"艾弗里-麦克劳德-麦卡蒂实验"},
{y:1952, n:"噬菌体实验", w:"赫尔希 Hershey / 蔡斯 Chase", c:"mol", lv:2, d:"用放射性标记噬菌体的蛋白质与 DNA，只检测到 DNA 进入细菌——搅拌机实验一锤定音，1969 年获诺贝尔奖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Hershey_Chase_experiment.png/500px-Hershey_Chase_experiment.png", wiki:"https://en.wikipedia.org/wiki/Hershey%E2%80%93Chase_experiment", wikiW:"https://en.wikipedia.org/wiki/Alfred_Hershey", wzh:"赫尔希-蔡斯实验"},
{y:1953, n:"DNA 双螺旋", w:"詹姆斯·沃森 James Watson / 弗朗西斯·克里克 Francis Crick", c:"mol", lv:1, q:"遗传信息的物质基础是什么？", d:"单页 Nature 论文，结构本身即暗示复制机制：'它没有逃过我们的眼睛……'。弗兰克林与威尔金斯的 X 射线衍射数据是关键证据。分子生物学时代从此开始。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/DNA_Structure%2BKey%2BLabelled.pn_NoBB.png/500px-DNA_Structure%2BKey%2BLabelled.pn_NoBB.png", wiki:"https://en.wikipedia.org/wiki/DNA", wikiW:"https://en.wikipedia.org/wiki/James_Watson", wzh:"DNA双螺旋结构", g:`Photo 51——那张揭示双螺旋的X射线衍射图，出自罗莎琳德·弗兰克林的实验室，被同事威尔金斯未经同意拿给沃森看。弗兰克林在1962年诺奖评审前死于卵巢癌（38岁），诺奖不授死者。沃森晚年回忆录对她多有贬损，直到近年才被正式正名。`},
{y:1953, n:"米勒-尤里实验", w:"斯坦利·米勒 Stanley Miller / 哈罗德·尤里 Harold Urey", c:"mol", lv:2, q:"生命最初是怎样产生的？（达尔文留白的问题）", d:"在烧瓶中模拟早期地球大气与闪电，一周内得到多种氨基酸——无机小分子可以自发形成生命的基础构件。但它并未创造生命：生命起源仍是科学未完全解决的难题，达尔文理论的边界正在于此。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Miller-Urey_experiment-en.svg/500px-Miller-Urey_experiment-en.svg.png", wiki:"https://en.wikipedia.org/wiki/Miller%E2%80%93Urey_experiment", wikiW:"https://en.wikipedia.org/wiki/Stanley_Miller_(chemist)", wzh:"米勒-尤里实验", g:`米勒做这个实验时还是研究生，导师尤里起初嫌'太像炼金术'。封存的实验装置在2010年代被重新打开分析——用现代质谱重新检测，当年样品里其实含有远多于当时认知的氨基酸种类。`},
{y:1956, n:"地球年龄 45.5 亿年", w:"克莱尔·帕特森 Clair Patterson", c:"div", lv:1, q:"演化拥有足够漫长的时间吗？", d:"帕特森用陨石铅同位素定出地球年龄约 45.5 亿年——远超达尔文时代物理学家开尔文估计的几千万年。达尔文曾因'时间不够'被开尔文压得抬不起头；深时（deep time）的确认让渐变演化拥有充裕的舞台。", wiki:"https://en.wikipedia.org/wiki/Age_of_the_Earth", wikiW:"https://en.wikipedia.org/wiki/Clair_Cameron_Patterson", wzh:"地球年龄", g:`帕特森为测铅同位素造了世界上第一个超净实验室——因为他发现环境铅污染毁了所有样品。顺藤摸瓜他发现大气铅污染来自汽油添加剂，随后二十年单挑整个石油行业，最终推动全球无铅汽油。一个测地球年龄的人，顺便救了千万儿童的智商。`},
{y:1958, n:"半保留复制/中心法则", w:"梅塞尔森 Meselson / 斯塔尔 Stahl / 克里克 Crick", c:"mol", lv:2, d:"梅塞尔森-斯塔尔用重氮标记证明 DNA 半保留复制（'生物学最美的实验'）；克里克同年提出中心法则：DNA→RNA→蛋白质。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/Meselson-stahl_experiment_diagram_en_chiral.svg/500px-Meselson-stahl_experiment_diagram_en_chiral.svg.png", wiki:"https://en.wikipedia.org/wiki/Meselson%E2%80%93Stahl_experiment", wikiW:"https://en.wikipedia.org/wiki/Matthew_Meselson", wzh:"梅塞尔森-斯塔尔实验"},
{y:1961, n:"操纵子模型", w:"弗朗索瓦·雅各布 François Jacob / 雅克·莫诺 Jacques Monod", c:"mol", lv:2, d:"乳糖操纵子揭示基因表达的开关机制——基因可被调控。mRNA 概念同年提出。1965 年诺贝尔奖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Lac_Operon.svg/500px-Lac_Operon.svg.png", wiki:"https://en.wikipedia.org/wiki/Lac_operon", wikiW:"https://en.wikipedia.org/wiki/Fran%C3%A7ois_Jacob", wzh:"乳糖操纵子"},
{y:1962, n:"叶绿体与线粒体起源", w:"早期内共生假说", c:"div", lv:2, d:"电镜与生化证据让'叶绿体、线粒体来自被吞噬的细菌'重新进入视野——为 1967 年马古利斯系统论证奠基。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Symbiogenesis_2_mergers.svg/500px-Symbiogenesis_2_mergers.svg.png", wiki:"https://en.wikipedia.org/wiki/Symbiogenesis", wikiW:"https://en.wikipedia.org/wiki/Lynn_Margulis", wzh:"内共生学说"},
{y:1963, n:"分子钟假说", w:"埃玛纽埃·祖卡坎德尔 Emile Zuckerkandl / 莱纳斯·鲍林 Linus Pauling", c:"evo", lv:2, d:"比较不同物种血红蛋白氨基酸差异，发现差异量与物种分化时间成正比——分子演化速率恒定。今天建树与定年的理论基础。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Molecular_evolution_bamboos.svg/500px-Molecular_evolution_bamboos.svg.png", wiki:"https://en.wikipedia.org/wiki/Molecular_clock", wikiW:"https://en.wikipedia.org/wiki/Emile_Zuckerkandl", wzh:"分子钟"},
{y:1965, n:"破解遗传密码", w:"马歇尔·尼伦伯格 Marshall Nirenberg / 哈尔·科拉纳 Har Gobind Khorana", c:"mol", lv:2, d:"尼伦伯格与马太用无细胞体系破译第一个密码子 UUU（苯丙氨酸），到 1966 年 64 个密码子全部破译——生命的信息表公之于世。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/RNA-codons.svg/500px-RNA-codons.svg.png", wiki:"https://en.wikipedia.org/wiki/Genetic_code", wikiW:"https://en.wikipedia.org/wiki/Marshall_Nirenberg", wzh:"遗传密码"},
{y:1967, n:"内共生学说系统论证", w:"林恩·马古利斯 Lynn Margulis", c:"div", lv:2, q:"复杂真核细胞是怎样形成的？", qt:2, d:"马古利斯（当时姓萨根）发表《有丝分裂细胞的起源》，系统论证真核细胞来自多次内共生——主流一度激烈反对，最终被分子证据证实。演化不只在物种层面，细胞本身就是演化的产物。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Symbiogenesis_2_mergers.svg/500px-Symbiogenesis_2_mergers.svg.png", wiki:"https://en.wikipedia.org/wiki/Symbiogenesis", wikiW:"https://en.wikipedia.org/wiki/Lynn_Margulis", wzh:"林恩·马古利斯", g:`马古利斯的论文被期刊拒了约15次才发表；主流嘲笑'这是科幻小说'。她还是天文学家卡尔·萨根的第一任妻子——家里餐桌上的日常话题就是'你们身体里的细菌'。`},
{y:1968, n:"中性进化理论", w:"木村资生 Motoo Kimura", c:"evo", lv:1, d:"木村提出分子水平的多数突变是中性或近中性的，固定靠随机漂变而非选择——'适者生存'在分子层面让位给'幸运者生存'。与选择论互补而非对立。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Masatoshi_Nei_with_Motoo_Kimura_in_a_restaurant_in_1986.png/500px-Masatoshi_Nei_with_Motoo_Kimura_in_a_restaurant_in_1986.png", wiki:"https://en.wikipedia.org/wiki/Neutral_theory_of_molecular_evolution", wikiW:"https://en.wikipedia.org/wiki/Motoo_Kimura", wzh:"分子演化的中性理论"},
{y:1970, n:"反转录酶", w:"霍华德·特明 Howard Temin / 戴维·巴尔的摩 David Baltimore", c:"mol", lv:2, d:"发现 RNA 肿瘤病毒能把 RNA 反转录为 DNA——中心法则被修正补充。1975 年诺贝尔奖，也为后来逆转录病毒研究（含 HIV）奠基。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Reverse_transcriptase_3KLF_labels.png/500px-Reverse_transcriptase_3KLF_labels.png", wiki:"https://en.wikipedia.org/wiki/Reverse_transcriptase", wikiW:"https://en.wikipedia.org/wiki/Howard_Martin_Temin", wzh:"逆转录酶"},
{y:1972, n:"限制酶与 DNA 重组", w:"保罗·伯格 Paul Berg / 斯坦利·科恩 Stanley Cohen / 赫伯特·博耶 Herbert Boyer", c:"mol", lv:2, d:"伯格完成首个体外重组 DNA；科恩与博耶 1973 年实现细菌克隆异源基因——遗传工程诞生，伯格 1980 年获诺贝尔化学奖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/Recombinant_formation_of_plasmids.svg/500px-Recominant_formation_of_plasmids.svg.png", wiki:"https://en.wikipedia.org/wiki/Recombinant_DNA", wikiW:"https://en.wikipedia.org/wiki/Paul_Berg", wzh:"保罗·伯格"},
{y:1972, n:"间断平衡学说", w:"斯蒂芬·古尔德 Stephen Jay Gould / 奈尔斯·埃尔德雷奇 Niles Eldredge", c:"evo", lv:2, side:-1, d:"针对化石记录的'缺环'，提出物种长期停滞、在短时间内快速成种——演化速率不均匀的宏演化观，向达尔文渐进论的公开挑战与修正。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/PunctuatedEquilibrium.png/500px-PunctuatedEquilibrium.png", wiki:"https://en.wikipedia.org/wiki/Punctuated_equilibrium", wikiW:"https://en.wikipedia.org/wiki/Stephen_Jay_Gould", wzh:"间断平衡"},
{y:1975, n:"分子水平的自然选择", w:"约翰·梅纳德·史密斯 John Maynard Smith 等", c:"evo", lv:2, d:"针对中性理论，选择论者证明氨基酸位点普遍受选择约束；两派论战把群体遗传学推向成熟——今天我们知道：大部分突变中性，功能位点受选择。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Mutation_and_selection_diagram_%282%29.svg/500px-Mutation_and_selection_diagram_%282%29.svg.png", wiki:"https://en.wikipedia.org/wiki/Selection_(genetics)", wikiW:"https://en.wikipedia.org/wiki/John_Maynard_Smith", wzh:"约翰·梅纳德·史密斯"},
{y:1977, n:"DNA 测序时代开启", w:"弗雷德里克·桑格 Frederick Sanger / 沃尔特·吉尔伯特 Walter Gilbert", c:"mol", lv:1, d:"桑格的双脱氧链终止法与吉尔伯特的化学降解法同年发表，人类第一次能读出 DNA 的字母序列。两人与桑格共享 1980 年诺贝尔化学奖。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Phylogenetic_tree_of_life_1990_LUCA.svg/500px-Phylogenetic_tree_of_life_1990_LUCA.svg.png", wiki:"https://en.wikipedia.org/wiki/Sanger_sequencing", wikiW:"https://en.wikipedia.org/wiki/Frederick_Sanger", wzh:"桑格测序法"},
{y:1977, n:"三域学说", w:"卡尔·乌斯 Carl Woese / 乔治·福克斯 George Fox", c:"div", lv:1, q:"分子证据会怎样改变生命之树？", qt:2, d:"用 16S rRNA 序列比较发现：原核生物其实是两域——细菌与古菌亲缘遥远，真核生物与古菌更近。生命之树从'两界'改写为'三域'——你 R 建树课的分子证据源头。达尔文依据形态与地理推断的亲缘关系，第一次被独立分子证据全面重绘。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Carl_Woese.jpg/500px-Carl_Woese.jpg", wiki:"https://en.wikipedia.org/wiki/Three-domain_system", wikiW:"https://en.wikipedia.org/wiki/Carl_Woese", wzh:"卡尔·乌斯"},
{y:1988, n:"Lenski 长期演化实验", w:"理查德·伦斯基 Richard Lenski", c:"evo", lv:1, q:"能否在实验室直接观察演化？", qt:2, d:"12 个大肠杆菌群体自 1988 年起每天传代、至今超过 7 万代——实验直接观察到适应性增长、突变率演变，甚至'重新进化'出利用柠檬酸的能力。演化不是历史故事，而是可实时记录、可重放（冻存祖先解冻比较）的过程。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Lenski%27s_12_long-term_lines_of_E._coli_on_25_June_2008.jpg/500px-Lenski%27s_12_long-term_lines_of_E._coli_on_25_June_2008.jpg", wiki:"https://en.wikipedia.org/wiki/E._coli_long-term_evolution_experiment", wikiW:"https://en.wikipedia.org/wiki/Richard_Lenski", wzh:"大肠杆菌长期演化实验", g:`Lenski 把每天的样品冻存在-80℃冰箱里——相当于给演化过程'存档'。发现柠檬酸利用突变后，他解冻祖先重放演化，证明该能力依赖此前的'铺垫突变'：历史偶然与必然在冰箱里共存。`},
{y:1943, n:"抗生素耐药性的开端", w:"亚历山大·弗莱明 Alexander Fleming / 青霉素临床应用", c:"evo", lv:2, q:"为什么同一群体中，有些个体能在药物下存活？", d:"青霉素投用仅数年，医院便出现耐药金黄色葡萄球菌——不是细菌'变强'，而是药物筛选出了本就存在的耐药个体。差异性生存与繁殖：自然选择正在我们眼前发生，公共卫生与养殖业至今仍在为此付出演化代价。", img:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Penicillin_core.svg/500px-Penicillin_core.svg.png", wiki:"https://en.wikipedia.org/wiki/Antimicrobial_resistance", wikiW:"https://en.wikipedia.org/wiki/Alexander_Fleming", wzh:"抗生素耐药性"},

const T0 = 1850, T1 = 2035;         // 数据年份范围
const PAD_L = 90, PAD_R = 130;      // 画布留白
const W = 17000;                      // 画布宽（px）
const x = y => PAD_L + (y - T0) / (T1 - T0) * (W - PAD_L - PAD_R);

const tl = document.getElementById("timeline");

// 世纪/年代刻度
for (let yr = 1860; yr <= 2030; yr += 20) {
  const t = document.createElement("div");
  t.className = "tick"; t.style.left = x(yr) + "px";
  const l = document.createElement("div");
  l.className = "tick-label"; l.style.left = x(yr) + "px"; l.textContent = yr;
  tl.appendChild(t); tl.appendChild(l);
}

// 事件密度谱：固定宽度导航条，每 20 年一格，点击某格缩放至该段
(function density(){
  const bins = {};
  EVENTS.forEach(ev => { const b = Math.floor(ev.y / 20) * 20; bins[b] = (bins[b] || 0) + 1; });
  const maxD = Math.max(...Object.values(bins));
  window._density = { bins, maxD };   // 供高亮函数复用
  const di = document.getElementById("densityInner");
  const Y0 = 1850, Y1 = 2040;   // 密度谱年份范围（首格起点 ~ 末格终点）
  for (let b = 1860; b <= 2020; b += 20) {
    const n = bins[b] || 0;
    const blk = document.createElement("div");
    blk.className = "bin";
    blk.dataset.year = b;
    blk.style.left = ((b - Y0) / (Y1 - Y0) * 100) + "%";
    blk.style.width = ((20 / (Y1 - Y0) * 100) - 0.5) + "%";
    if (n > 0) {
      const L = 92 - (n / maxD) * 40;   // 密度1≈浅橙，密度12≈深橙
      blk.style.background = `hsl(26, 66%, ${L}%)`;
      blk.title = `${b}–${b + 19}：${n} 个事件（点击缩放到此）`;
    } else {
      blk.style.background = "#eeeae3";   // 无事件：浅灰底色
      blk.title = `${b}–${b + 19}：无事件（点击缩放到此）`;
    }
    const yl = document.createElement("span");
    yl.className = "y";
    yl.textContent = b;
    blk.appendChild(yl);
    blk.addEventListener("click", () => zoomToEra(b));
    di.appendChild(blk);
  }
})();

// 布局：两侧行分配器——按年份顺序，轮流试上侧/下侧，放入“行的右边界放得下”的最浅行
const CARD_W = 430, GAP = 160;   // 卡宽与最小水平净间距（卡间不重叠）
const bounds = {1: [], "-1": []};  // side -> 每行右边界 px
function tryPlace(px, side) {
  const rs = bounds[side];
  for (let r = 0; r <= rs.length; r++) {
    const rb = rs[r] !== undefined ? rs[r] : -Infinity;
    if (px - rb >= CARD_W / 2 + GAP) return r;
  }
  return -1;
}
const placed = EVENTS.slice().sort((a, b) => a.y - b.y).map((ev, i) => {
  const px = x(ev.y);
  // 偶数事件优先上侧、奇数优先下侧（自然交替），放不下才加深；side 字段可强制指定侧
  const first = ev.side !== undefined ? ev.side : (i % 2 === 0 ? 1 : -1);
  let side = first, row = tryPlace(px, side);
  if (row < 0) { side = -first; row = tryPlace(px, side); }
  if (row < 0) { // 两侧都放不下：加深优先侧
    side = first; row = bounds[side].length;
  }
  bounds[side][row] = Math.max(bounds[side][row] !== undefined ? bounds[side][row] : -Infinity, px + CARD_W / 2);
  return {...ev, side, row};
});

for (const ev of placed) {
  const el = document.createElement("div");
  el.className = "event " + (ev.side > 0 ? "up" : "dn");
  el.style.left = x(ev.y) + "px";
  el.style.top = "52%";
  el.style.color = CAT_COLOR[ev.c];
  el.style.height = "0";           // 锚定中线，stem/card 绝对定位展开

  const stemLen = (ev.lv === 1 ? 32 : 20) + ev.row * 70;   // 初始行距70；渲染后再按实测卡高微调
  const stem = document.createElement("div");
  stem.className = "stem";
  stem.style.height = stemLen + "px";
  if (ev.side > 0) stem.style.bottom = "0"; else stem.style.top = "0";

  const dot = document.createElement("div");
  dot.className = "dot";
  const dsz = ev.lv === 1 ? 15 : 10;
  dot.style.width = dot.style.height = dsz + "px";
  dot.style.top = ev.side > 0 ? (-stemLen) + "px" : stemLen + "px";

  const card = document.createElement("div");
  card.className = "card";
  if (ev.side > 0) {
    card.style.top = "auto";
    card.style.bottom = (stemLen + 6) + "px";
  } else {
    card.style.top = (stemLen + 6) + "px";
  }
  card.innerHTML = `<div class="name">${ev.g ? "📖 " : ""}${ev.q ? (ev.qt===2 ? "🔭 " : "🧭 ") : ""}${ev.n}</div><div class="meta">${ev.w} · ${ev.y}</div>`;
  const det = document.createElement("div");
  det.className = "detail";
  det.style.display = "none";
  det.innerHTML = `<h3>${ev.wiki ? `<a href="${ev.wiki}" target="_blank" rel="noopener">${ev.n}</a>` : ev.n}</h3><div class="who">${ev.wikiW ? `<a href="${ev.wikiW}" target="_blank" rel="noopener">${ev.w}</a>` : ev.w} · ${ev.y} · ${CAT_NAME[ev.c]}${ev.lv===1?" · 里程碑":""}</div>` +
    (ev.q ? `<div class="darwinq ${ev.qt===2?'q2':''}"><span class="qtag">${ev.qt===2?"🔭 时空之旅新问：":"🧭 达尔文之问："}</span>${ev.q}</div>` : "") +
    `<p>${ev.d}</p>` +
    (ev.img ? `<img class="evimg" src="${ev.img}" alt="${ev.n}" loading="lazy" onerror="this.style.display='none'">` : "") +
    (ev.g ? `<div class="gossip"><div class="gtag">📖 一则八卦</div>${ev.g}</div>` : "");
  // 详情卡初值：远离轴；渲染后统一做视口边界翻转
  if (ev.side > 0) {
    det.style.bottom = (stemLen + 70) + "px"; det.style.top = "auto";
  } else {
    det.style.top = (stemLen + 70) + "px"; det.style.bottom = "auto";
  }

  el.dataset.lv = ev.lv;
  el.dataset.row = ev.row;
  if (ev.q) el.dataset.q = "1";
  if (ev.qt === 2) el.dataset.t = "1";
  el.append(stem, dot, card, det);
  tl.appendChild(el);
}

// ===== 渲染后二次布局：按各行实测卡高收紧行距，防止溢出视口 =====
(function tighten(){
  const els = [...document.querySelectorAll('.event')];
  // 每侧每行的 [最高卡高]
  const rowH = {up: [], dn: []};
  els.forEach(el=>{
    const side = el.classList.contains('up') ? 'up' : 'dn';
    const row = +el.dataset.row;
    const h = el.querySelector('.card').offsetHeight;
    rowH[side][row] = Math.max(rowH[side][row] || 0, h);
  });
  // 各行累计偏移（含 10px 净距）
  const offset = {up: [], dn: []};
  ['up','dn'].forEach(sd => {
    let acc = 0;
    rowH[sd].forEach((h, r) => { offset[sd][r] = acc; acc += h + 6; });
  });
  els.forEach(el=>{
    const side = el.classList.contains('up') ? 'up' : 'dn';
    const row = +el.dataset.row;
    const lv = +el.dataset.lv;
    const stemLen = (lv === 1 ? 30 : 18) + offset[side][row];
    el.querySelector('.stem').style.height = stemLen + 'px';
    el.querySelector('.dot').style.top = (side === 'up' ? -stemLen : stemLen) + 'px';
    const card = el.querySelector('.card');
    if (side === 'up') { card.style.bottom = (stemLen + 6) + 'px'; }
    else { card.style.top = (stemLen + 6) + 'px'; }
  });
})();

// ===== 筛选开关：只显示带"达尔文之问"的事件 =====
const qBtn = document.getElementById("qFilterBtn");
qBtn.addEventListener("click", () => {
  document.body.classList.toggle("q-only");
  const on = document.body.classList.contains("q-only");
  qBtn.classList.toggle("active", on);
  qBtn.textContent = on ? "🧭 达尔文之问：开" : "🧭 达尔文之问：关";
});

// ===== 导览模式：tour.sel 选择站点集合（达尔文之旅=带🧭的；时空之旅=全部事件）=====
const tourBtn = document.getElementById("tourBtn");
const allTourBtn = document.getElementById("allTourBtn");
let tour = null;   // { i, timer, sel }
const TOUR_STAY = 6000;   // 每站停留 ms

function tourStop() {
  if (tour) { clearTimeout(tour.timer); tour = null; }
  tourBtn.classList.remove("active");
  tourBtn.textContent = "▶ 达尔文之旅";
  allTourBtn.classList.remove("active");
  allTourBtn.textContent = "▶ 时空之旅";
  if (window.hideTip) window.hideTip();
}

function tourStart(sel) {
  if (tour) tourStop();
  const btn = sel === '.event[data-q]' ? tourBtn : allTourBtn;
  btn.classList.add("active");
  btn.textContent = "⏸ 退出（←/→ 切换）";
  tour = { i: -1, timer: 0, sel };
  tourGoTo(0);
}

// 飞到事件并停留显示详情
function tourGoTo(i) {
  const els = [...document.querySelectorAll(tour ? tour.sel : '.event[data-q]')];
  if (!els.length) return tourStop();
  if (i >= els.length) i = 0;   // 走完全程后循环播放
  if (i < 0) i = els.length - 1;
  tour = { i, timer: 0, sel: tour ? tour.sel : '.event[data-q]' };
  const el = els[i];
  const left = parseFloat(el.style.left);
  const targetS = 0.9;
  const targetTx = vp.clientWidth * 0.5 - left * targetS;
  const targetTy = vp.clientHeight * 0.5 - (parseFloat(el.style.top) / 100 * vp.clientHeight) * targetS - 64 * targetS;
  animateView(targetS, targetTx, targetTy, 1400);
  // 动画结束后直接弹出详情卡：一次飞行直达事件，不再做二次居中修正
  setTimeout(() => {
    if (!tour) return;   // 途中被取消
    const tip2 = document.getElementById('detailTip');
    tip2.innerHTML = `<div class="detail">${el.querySelector('.detail').innerHTML}</div>`;
    tip2.style.color = getComputedStyle(el).color;
    tip2.style.display = 'block';
    requestAnimationFrame(()=>tip2.classList.add('show'));
    // 站点序号徽标
    const badge = document.createElement('div');
    const tname = tour.sel === '.event' ? "🚀 时空之旅" : "🧭 达尔文之旅";
    badge.textContent = `${tname} · 第 ${i + 1} / ${els.length} 站`;
    badge.style.cssText = 'font-weight:700;color:#4F7A3F;font-size:13px;margin-bottom:4px;';
    tip2.insertBefore(badge, tip2.firstChild);
    // 放在视口中固定的舒适位置（右上）
    tip2.style.left = Math.max(12, vp.clientWidth - tip2.offsetWidth - 12) + 'px';
    tip2.style.top = '12px';
    tour.timer = setTimeout(() => {
      if (!tour) return;
      // 直接飞往下一站：详情卡保持显示，不回到全景
      tourGoTo(i + 1);
    }, TOUR_STAY);
  }, 1450);
}

tourBtn.addEventListener("click", () => {
  if (tour && tour.sel === '.event[data-q]') return tourStop();   // 再点一次=退出
  tourStart('.event[data-q]');
});
allTourBtn.addEventListener("click", () => {
  if (tour && tour.sel === '.event') return tourStop();
  tourStart('.event');
});

// 键盘：← 上一站 / → 下一站（导览中生效）；Esc 退出
document.addEventListener("keydown", e => {
  if (!tour) return;
  if (e.key === "ArrowRight") { e.preventDefault(); clearTimeout(tour.timer); window.hideTip(); tourGoTo(tour.i + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); clearTimeout(tour.timer); window.hideTip(); tourGoTo(Math.max(0, tour.i - 1)); }
  else if (e.key === "Escape") { tourStop(); }
});

// 用户任何手动操作（拖动/滚轮/点击密度条）都退出导览
// （vp 在后文才声明，故延迟注册避免 TDZ 错误）
window.addEventListener("load", () => {
  ['mousedown', 'wheel', 'touchstart'].forEach(evt =>
    vp.addEventListener(evt, () => { if (tour) tourStop(); }, { passive: true }));
  document.getElementById('densityInner').addEventListener('click', () => { if (tour) tourStop(); });
});

// ===== 详情卡：钉住式 tooltip（悬停弹出后固定，可移入点击链接） =====
(function tooltip(){
  const tip = document.createElement('div');
  tip.id = 'detailTip';
  document.body.appendChild(tip);
  let activeEv = null;

  function place(e, evEl){
    // 优先放在事件点旁边（不跟鼠标），避让视口
    const r = evEl.querySelector('.dot').getBoundingClientRect();
    const w = 300, h = tip.offsetHeight || 150;
    let x = r.right + 18, y = r.top - 40;
    if (x + w > innerWidth - 12) x = r.left - w - 18;
    if (x < 12) x = 12;
    if (y + h > innerHeight - 12) y = innerHeight - h - 12;
    if (y < 12) y = 12;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseover', e => {
    const ev = e.target.closest('.event');
    if (ev === activeEv) return;
    if (ev) {
      activeEv = ev;
      tip.innerHTML = `<div class="detail">${ev.querySelector('.detail').innerHTML}</div>`;
      tip.style.color = getComputedStyle(ev).color;
      tip.style.display = 'block';
      requestAnimationFrame(()=>tip.classList.add('show'));
      place(e, ev);
    } else if (!tip.contains(e.target)) {
      // 移到别处（非当前事件、非 tip 内）→ 关闭
      tip.style.display = 'none'; tip.classList.remove('show');
      activeEv = null;
    }
  });
  // 拖动平移时关闭 tip，避免停在旧位置
  window.hideTip = () => { tip.style.display = 'none'; tip.classList.remove('show'); activeEv = null; };
})();

// ===== 交互：地图式缩放（先全景 → 滚轮 zoom → 拖动平移）=====
const vp = document.getElementById("viewport");
const stage = document.getElementById("stage");

let view = { s: 1, tx: 0, ty: 0 };
let minScale = 0.05;
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function apply(){
  stage.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.s})`;
  highlightDensity();
  updateStats();
}

// 更新可视区间与事件数量统计
function updateStats(){
  const [y0, y1] = currentYears();
  const y0c = Math.max(1859, Math.round(y0));
  const y1c = Math.min(2026, Math.round(y1));
  const cnt = EVENTS.filter(ev => ev.y >= y0 && ev.y <= y1).length;
  const st = document.getElementById('viewStats');
  if (st) {
    st.innerHTML = `可视区间 <b>${y0c}–${y1c}</b> · 事件 <b>${cnt}</b>`;
  }
}

// 当前视口覆盖的年份范围
function currentYears(){
  const cx0 = (0 - view.tx) / view.s;                    // 视口左边缘在画布上的 x
  const cx1 = (vp.clientWidth - view.tx) / view.s;       // 视口右边缘在画布上的 x
  const y0 = T0 + (cx0 - PAD_L) / (W - PAD_L - PAD_R) * (T1 - T0);
  const y1 = T0 + (cx1 - PAD_L) / (W - PAD_L - PAD_R) * (T1 - T0);
  return [y0, y1];
}

// 高亮当前视口覆盖的密度谱格（直接加深背景色，不依赖 filter）
function highlightDensity(){
  const [y0, y1] = currentYears();
  const { bins, maxD } = window._density;
  document.querySelectorAll('#densityInner .bin').forEach(bin => {
    const b = +bin.dataset.year;
    const active = (b + 20 >= y0 && b <= y1);
    bin.classList.toggle('active', active);
    const n = bins[b] || 0;
    if (n > 0) {
      const base = 92 - (n / maxD) * 40;
      bin.style.background = `hsl(26, 66%, ${active ? base - 9 : base}%)`;
    } else {
      bin.style.background = active ? "#dcd6ca" : "#eeeae3";
    }
  });
}

// 点击密度谱某格：缩放至该时间段（该 20 年占视口约 62%，垂直居中）
function zoomToEra(b){
  const w20 = x(b + 20) - x(b);
  const targetS = clamp((vp.clientWidth * 0.62) / w20, minScale, 3.5);
  const yc = b + 10;
  const targetTx = vp.clientWidth / 2 - x(yc) * targetS;
  const targetTy = vp.clientHeight * 0.5 - vp.clientHeight * 0.52 * targetS - 64 * targetS;
  animateView(targetS, targetTx, targetTy);
}

// 缓动动画：从当前 view 平滑过渡到目标（easeInOutCubic）
let animId = null;
function animateView(ts, ttx, tty, dur = 700){
  if (animId) cancelAnimationFrame(animId);
  const s0 = view.s, tx0 = view.tx, ty0 = view.ty;
  const t0 = performance.now();
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = ease(k);
    view.s = s0 + (ts - s0) * e;
    view.tx = tx0 + (ttx - tx0) * e;
    view.ty = ty0 + (tty - ty0) * e;
    apply();
    if (k < 1) animId = requestAnimationFrame(step);
    else animId = null;
  };
  animId = requestAnimationFrame(step);
}

// 初始/重置：全景视图（横向 fit 全部 1859–2026）
function fitToView(){
  const pad = 40, vw = vp.clientWidth, vh = vp.clientHeight;
  minScale = Math.max(0.02, (vw - pad * 2) / W);
  view.s = minScale;
  view.tx = pad;
  view.ty = vh * 0.5 - vh * 0.52 * view.s - 64 * view.s;   // 主轴(52%)落在视口垂直中心
  apply();
}
fitToView();
window.addEventListener("resize", fitToView);
document.getElementById("resetBtn").addEventListener("click", fitToView);

// 滚轮缩放（以鼠标位置为焦点）
vp.addEventListener("wheel", e => {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  const ns = clamp(view.s * f, minScale, 3.5);
  const k = ns / view.s;
  view.tx = e.clientX - (e.clientX - view.tx) * k;
  view.ty = e.clientY - (e.clientY - view.ty) * k;
  view.s = ns;
  apply();
}, { passive: false });

// 拖动平移
let dragging = false, sx = 0, sy = 0, oTx = 0, oTy = 0, moved = false;
vp.addEventListener("mousedown", e => {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  dragging = true; moved = false;
  sx = e.clientX; sy = e.clientY; oTx = view.tx; oTy = view.ty;
  vp.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; if (window.hideTip) window.hideTip(); }
  view.tx = oTx + dx; view.ty = oTy + dy;
  apply();
});
window.addEventListener("mouseup", () => { dragging = false; vp.classList.remove("dragging"); });

// 触屏：单指平移，双指捏合缩放
let ts = null;
vp.addEventListener("touchstart", e => {
  if (e.touches.length === 1) ts = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: view.tx, ty: view.ty };
  else if (e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; ts = { d: Math.hypot(dx, dy), s: view.s }; }
}, { passive: true });
vp.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && ts && ts.x !== undefined) {
    view.tx = ts.tx + (e.touches[0].clientX - ts.x); view.ty = ts.ty + (e.touches[0].clientY - ts.y); apply();
  } else if (e.touches.length === 2 && ts && ts.d) {
    const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
    view.s = clamp(ts.s * (Math.hypot(dx, dy) / ts.d), minScale, 3.5); apply();
  }
}, { passive: true });

// 提示条自动淡出
setTimeout(() => { const h = document.getElementById("hint"); h.style.opacity = 0; }, 6000);
</script>
