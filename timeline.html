<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物学发现时间线 · 1665–2026（交互版）</title>
<style>
  :root {
    --evolution: #6A994E; --genetics: #BC4749; --molecule: #2A6F97;
    --diversity: #9C6644; --frontier: #7F5AF0; --cell: #2E86AB;
    --bg: #FAF9F6; --ink: #222;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); overflow: hidden; }

  header { padding: 10px 28px 2px; }
  header h1 { font-size: 22px; font-weight: 700; display: inline; }
  header p  { font-size: 13px; color: #777; margin-top: 2px; }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 4px 28px 0px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

  /* 地图式缩放视窗 */
  #viewport { position: relative; height: calc(100vh - 88px); overflow: hidden;
              cursor: grab; background: var(--bg); }
  #viewport.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; width: 17000px; height: 100%;
           transform-origin: 0 0; will-change: transform; }

  #resetBtn { position: fixed; right: 20px; bottom: 64px; z-index: 60;
              padding: 8px 14px; font-size: 13px; border: 1px solid #c9c5bd;
              border-radius: 20px; background: #fff; color: #555; cursor: pointer;
              box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #resetBtn:hover { background: #efede8; }

  /* 事件密度谱（固定宽度导航条：始终显示完整全景，点击某格缩放至该段） */
  #densityBar { position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
                background: var(--bg); border-top: 1px solid #e5e2da; z-index: 5;
                display: flex; }
  #densityBar .dlabel { flex: 0 0 auto; display: flex; align-items: center;
                        font-size: 12px; color: #999; padding: 0 12px; white-space: nowrap; }
  #densityInner { flex: 1 1 auto; position: relative; height: 100%; }
  #densityInner .bin { position: absolute; top: 0; height: 100%; cursor: pointer; }
  #densityInner .bin:hover { filter: brightness(1.08); }
  #densityInner .bin .y { position: absolute; bottom: 3px; left: 50%;
                          transform: translateX(-50%); font-size: 9px;
                          color: #9a9488; pointer-events: none; }
  #densityInner .bin.active .y { color: #111; font-weight: 700; }

  /* 可视区间统计（密度条上方） */
  #viewStats { position: absolute; left: 14px; bottom: 50px; z-index: 6;
               padding: 5px 12px; font-size: 12.5px; color: #555;
               background: rgba(255,255,255,.92); border: 1px solid #e5e2da;
               border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
               white-space: nowrap; }
  #viewStats b { color: #7F5AF0; font-weight: 700; }

  #timeline { position: relative; height: 100%; width: 17000px; }

  /* 主轴 */
  .axis { position: absolute; left: 0; right: 0; top: 45%; height: 3px;
          background: #555; border-radius: 2px; }
  /* 世纪刻度 */
  .tick { position: absolute; top: calc(45% - 7px); width: 1.5px; height: 17px; background: #999; }
  .tick-label { position: absolute; top: calc(45% + 16px); transform: translateX(-50%);
                font-size: 14px; color: #888; }
  /* 时代分区 */
  .era { position: absolute; top: 2px; font-size: 15px; color: #8a8578;
         border-left: 2px solid #d8d4ca; padding-left: 8px; white-space: nowrap; }

  /* 事件节点 */
  .event { position: absolute; transform: translateX(-50%); width: 200px;
           transition: transform .18s ease, z-index 0s; }
  .event .stem { position: absolute; left: 50%; width: 2.5px; background: currentColor; }
  .event .dot  { position: absolute; left: 50%; transform: translate(-50%, -50%);
                 border-radius: 50%; background: currentColor; border: 2px solid #fff;
                 box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: all .18s ease; }
  .event .card { position: absolute; left: 50%; transform: translateX(-50%);
                 width: 200px; text-align: center; transition: all .18s ease; }
  .event .name { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .event .meta { font-size: 11px; color: #888; margin-top: 2px; }
  .event.up    { color: inherit; }
  .event.up .card { bottom: calc(100% - 50%); margin-bottom: 14px; }
  .event.up .stem { bottom: 50%; }
  .event.dn .card { top: calc(100% - 50%); margin-top: 14px; }
  .event.dn .stem { top: 50%; }

  /* 悬停放大：卡与点整体上浮/下沉放大 */
  .event:hover { z-index: 50; }
  .event:hover .dot { transform: translate(-50%, -50%) scale(1.7); }
  .event:hover .name { font-size: 18px; }
  .event:hover .meta { font-size: 14px; color: #555; }
  .event.up:hover .card { margin-bottom: 22px; }
  .event.dn:hover .card { margin-top: 22px; }

  /* 悬停详情气泡 */
  #detailTip { position: fixed; width: 300px; padding: 12px 14px;
                   background: #fff; border-radius: 10px;
                   box-shadow: 0 8px 30px rgba(0,0,0,.18); border-top: 4px solid currentColor;
                   display: none; z-index: 999;
                   text-align: left; font-size: 14px; line-height: 1.7;
                   color: #222; }
  .event:hover .detail { opacity: 1; }
  .detail h3 { font-size: 16px; margin-bottom: 4px; }
  .detail .who { color: #999; font-size: 12.5px; margin-bottom: 6px; }
  .detail p { color: #444; }
  .detail .gossip { margin-top: 8px; padding: 8px 10px; background: #FBF6EC;
                 border: 1px dashed #D4B996; border-radius: 8px; font-size: 13px;
                 line-height: 1.65; color: #6B5B3E; }
  .detail .gossip .gtag { font-weight: 700; color: #B08430; font-size: 12.5px; margin-bottom: 3px; }
  .detail .src { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd;
                 font-size: 12.5px; color: #999; }
  .detail .src a { color: #2A6F97; text-decoration: none; }
  .detail .src a:hover { text-decoration: underline; }

  /* 提示条 */
  .hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
          background: rgba(40,40,40,.82); color: #fff; font-size: 13.5px;
          padding: 7px 16px; border-radius: 18px; pointer-events: none;
          transition: opacity .5s; }
</style>
</head>
<body>

<header>
  <h1>生物学发现时间线 · 1665–2026</h1>
  <p>📖 标记 = 藏有科学八卦（人物恩怨/命运转折/偶然发现）　|　从胡克的细胞到 AlphaFold：细胞与遗传时代 → 《物种起源》之后 → 编辑与 AI 前沿　|　拖动或滚轮横向滑动 · 悬停查看详情</p>
</header>

<div class="legend">
  <span><i style="background:var(--cell)"></i>细胞篇</span>
  <span><i style="background:var(--genetics)"></i>遗传与变异篇</span>
  <span><i style="background:var(--evolution)"></i>演化生物学</span>
  <span><i style="background:var(--molecule)"></i>分子与基因组</span>
  <span><i style="background:var(--diversity)"></i>多样性与生态</span>
  <span><i style="background:var(--frontier)"></i>前沿技术</span>
</div>

<div id="viewport"><div id="stage"><div id="timeline"><div class="axis"></div></div></div>
<div id="densityBar"><span class="dlabel">事件密度 · 20年/格 · 点击某格缩放到该段</span><div id="densityInner"></div></div>
</div>
<button id="resetBtn" title="重置为全景视图">⤢ 重置视图</button>
<div id="viewStats">可视区间 <b>—</b> · 事件 <b>—</b></div>
<div class="hint" id="hint">先看全景 → 滚轮缩放（zoom in）→ 放大后按住拖动平移，鼠标悬停事件点查看详情</div>

<script>
// ===== 数据 =====
// cat: cell细胞 / gen遗传 / mol分子 / evo演化 / div多样性 / fro前沿
// lv:  1里程碑(大点粗干) / 2重要(小点细干)
const EVENTS = [
// —— 前图：细胞与遗传时代 ——
{y:1665, n:"显微镜下首次看到细胞", w:"罗伯特·胡克 Robert Hooke", c:"cell", lv:2, d:"胡克用自制复式显微镜观察软木栓，看到一个个小室，命名为 cell（小室）。这是人类第一次看到细胞——但看到的是死细胞的细胞壁。", wiki:"https://en.wikipedia.org/wiki/Robert_Hooke", wzh:"罗伯特·胡克", g:`胡克与列文虎克：名字像到让学生抓狂的两人是同龄人（相差3岁）。布商出身的列文虎克不会拉丁文、没上过大学，他把观察信件寄给皇家学会——审稿人正是胡克。学界起初不信'水里有微动物'，胡克1677年亲自复核并当众演示，为这位业余人士背书。后来两人却因磨镜方法保密问题交恶——列文虎克的绝技带进了坟墓，至今没人完全复原。`},
{y:1674, n:"发现微生物世界", w:"安东尼·范·列文虎克 Antonie van Leeuwenhoek", c:"cell", lv:2, d:"列文虎克用自磨镜片的单式显微镜观察到雨水、池塘水中的原生动物、轮虫与细菌，打开了肉眼不可见的生命世界。他一生写给皇家学会的信件记录了数百种微生物。", wiki:"https://en.wikipedia.org/wiki/Antonie_van_Leeuwenhoek", wzh:"列文虎克"},
{y:1838, n:"细胞学说（植物）", w:"马蒂亚斯·施莱登 Matthias Schleiden", c:"cell", lv:1, d:"施莱登提出植物体由细胞组成，细胞是植物体的基本结构单位。次年施万将其推广到动物，魏尔肖 1855 年补充'细胞来自细胞'（Omnis cellula e cellula），三句话构成完整细胞学说——生物学史上第一个大统一理论。", wiki:"https://en.wikipedia.org/wiki/Cell_theory", wzh:"细胞学说"},
{y:1839, n:"细胞学说（动物）", w:"特奥多尔·施万 Theodor Schwann", c:"cell", lv:2, d:"施万将'一切生物由细胞组成'从植物推广到动物，证明动植物结构统一于细胞。细胞学说从此成为整个生命科学的基石。", wiki:"https://en.wikipedia.org/wiki/Theodor_Schwann", wzh:"特奥多尔·施万"},
{y:1855, n:"细胞来自细胞", w:"鲁道夫·魏尔肖 Rudolf Virchow", c:"cell", lv:2, d:"魏尔肖提出'一切细胞来自已有细胞'，否定了自然发生说，为细胞病理学奠基。三段式细胞学说至此完整。", wiki:"https://en.wikipedia.org/wiki/Rudolf_Virchow", wzh:"魏尔肖"},
{y:1859, n:"《物种起源》出版", w:"查尔斯·达尔文 Charles Darwin", c:"evo", lv:1, d:"11 月 24 日伦敦首发 1250 册当天售罄。以自然选择为核心的共同祖先学说，把林奈的分类树变成真实的家谱——两图在此交汇。", wiki:"https://en.wikipedia.org/wiki/On_the_Origin_of_Species", wzh:"物种起源", g:`达尔文收到华莱士从马来群岛寄来的论文，发现与自己压了20年的理论几乎相同，几乎精神崩溃。在朋友劝说下，1858年两人的论文被联合宣读——达尔文次年才匆匆出版《物种起源》。华莱士终生自认'达尔文的追随者'，并无怨言。`},
{y:1831, n:"发现细胞核", w:"罗伯特·布朗 Robert Brown", c:"cell", lv:2, d:"布朗（后来以布朗运动闻名）在兰科植物表皮细胞中观察到细胞核并命名 nucleus。遗传物质的家在细胞学说成型前就已找到。", wiki:"https://en.wikipedia.org/wiki/Robert_Brown_(botanist,_born_1773)", wzh:"罗伯特·布朗"},
{y:1865, n:"遗传定律（被埋没）", w:"格雷戈尔·孟德尔 Gregor Mendel", c:"gen", lv:1, d:"孟德尔在布尔诺自然学会宣读豌豆实验论文：分离定律与自由组合定律。此后 35 年无人问津——直到 1900 年三人独立重发现。达尔文至死不知孟德尔。", wiki:"https://en.wikipedia.org/wiki/Gregor_Mendel", wzh:"孟德尔", g:`孟德尔的论文重印本躺在达尔文书房里，据说页边还有记号，但两人从未通信——历史学家至今争论达尔文是否真的读懂了它。若他注意到'粒子遗传'，进化论可能提前30年补上机制。`},
{y:1866, n:"海克尔系统树与生态学", w:"恩斯特·海克尔 Ernst Haeckel", c:"div", lv:2, d:"海克尔绘制通用系统发生树、创造'生态学'(Ökologie)一词，并把达尔文思想推向德国。'系统发生'概念从此与演化绑定。", wiki:"https://en.wikipedia.org/wiki/Ernst_Haeckel", wzh:"海克尔"},
{y:1876, n:"发现细胞呼吸", w:"普费弗等", c:"cell", lv:2, d:"普费弗等开始用实验研究活细胞的呼吸与渗透，细胞生理学从描述走向定量。", wiki:"https://en.wikipedia.org/wiki/Cellular_respiration", wzh:"细胞呼吸"},
{y:1897, n:"发现酶与发酵", w:"爱德华·毕希纳 Eduard Buchner", c:"cell", lv:2, d:"毕希纳用无细胞酵母汁实现糖发酵，证明发酵不需完整活细胞——'酿酶'的发现为酶学打开大门，他因此获 1907 年诺贝尔化学奖。", wiki:"https://en.wikipedia.org/wiki/Eduard_Buchner", wzh:"毕希纳"},
{y:1898, n:"发现高尔基体", w:"卡米洛·高尔基 Camillo Golgi", c:"cell", lv:2, d:"高尔基用银染法在神经细胞内显示出网状细胞器，后来以他命名。细胞器的精细世界在 20 世纪电镜时代才真正展开。", wiki:"https://en.wikipedia.org/wiki/Golgi_apparatus", wzh:"高尔基体"},
{y:1900, n:"孟德尔定律重发现", w:"德弗里斯 de Vries / 柯伦斯 Correns / 丘谢马克 Tschermak", c:"gen", lv:1, d:"三人各自独立实验后几乎同时读到孟德尔 1865 年论文，遗传学在此刻正式诞生——科学史上著名的'多重独立发现'。", wiki:"https://en.wikipedia.org/wiki/Mendelian_inheritance", wzh:"孟德尔定律"},
{y:1902, n:"染色体与遗传的联系", w:"沃尔特·萨顿 Walter Sutton / 特奥多尔·鲍维里 Theodor Boveri", c:"gen", lv:2, d:"他们注意到减数分裂中染色体的行为与孟德尔因子完全平行，提出遗传的染色体学说——基因从此有了实体载体（还未命名）。", wiki:"https://en.wikipedia.org/wiki/Theodor_Boveri", wzh:"鲍维里"},
{y:1908, n:"哈迪-温伯格平衡", w:"戈弗雷·哈迪 G. H. Hardy / 威廉·温伯格 Wilhelm Weinberg", c:"gen", lv:2, d:"数学家哈迪与医生温伯格各自证明：无选择、无漂变、随机交配下基因频率保持不变——群体遗传学的理论基石，也是今天 R 建树与中性理论的前奏。", wiki:"https://en.wikipedia.org/wiki/Hardy–Weinberg_principle", wzh:"哈代-温伯格定律"},
{y:1910, n:"基因在染色体上", w:"托马斯·摩尔根 Thomas Hunt Morgan", c:"gen", lv:1, d:"摩尔根用果蝇白眼突变证明基因位于染色体上，并提出连锁与交换（遗传第三定律），1933 年获诺贝尔奖。基因从抽象符号变成染色体上的实体。", wiki:"https://en.wikipedia.org/wiki/Thomas_Hunt_Morgan", wzh:"摩尔根"},
{y:1928, n:"转化现象", w:"弗雷德里克·格里菲斯 Frederick Griffith", c:"mol", lv:2, d:"格里菲斯发现死掉的致病型肺炎链球菌能把无毒菌株'转化'为有毒菌株——某种未知因子在细菌间传递遗传性状。", wiki:"https://en.wikipedia.org/wiki/Griffith_experiment", wzh:"格里菲斯实验"},
{y:1937, n:"现代综合进化论", w:"费奥多西·杜布赞斯基 Theodosius Dobzhansky", c:"evo", lv:1, side:1, d:"《遗传学与物种起源》把群体遗传学与达尔文选择论融合：自然选择作用于种群内的等位基因频率——'达尔文+孟德尔'的现代综合运动由此启动，迈尔、赫胥黎、辛普森等相继完成。", wiki:"https://en.wikipedia.org/wiki/Modern_synthesis_(20th_century)", wzh:"现代综合进化论"},
{y:1942, n:"物种的生物学概念", w:"恩斯特·迈尔 Ernst Mayr", c:"evo", lv:2, d:"迈尔系统提出以生殖隔离为核心的物种概念，并推动'现代综合'的动物学部分。物种不再只是形态相似，而是'实际上或潜在可相互交配的自然群体'。", wiki:"https://en.wikipedia.org/wiki/Ernst_Mayr", wzh:"恩斯特·迈尔"},
{y:1944, n:"DNA 是遗传物质", w:"奥斯瓦尔德·艾弗里 Oswald Avery", c:"mol", lv:2, side:-1, d:"艾弗里等纯化肺炎链球菌的转化因子，证明是 DNA 而非蛋白质——但当时无人敢信，'如此单调的分子怎么携带遗传信息？'", wiki:"https://en.wikipedia.org/wiki/Avery–MacLeod–McCarty_experiment", wzh:"艾弗里-麦克劳德-麦卡蒂实验"},
{y:1952, n:"噬菌体实验", w:"赫尔希 Hershey / 蔡斯 Chase", c:"mol", lv:2, d:"用放射性标记噬菌体的蛋白质与 DNA，只检测到 DNA 进入细菌——搅拌机实验一锤定音，1969 年获诺贝尔奖。", wiki:"https://en.wikipedia.org/wiki/Hershey–Chase_experiment", wzh:"赫尔希-蔡斯实验"},
{y:1953, n:"DNA 双螺旋", w:"詹姆斯·沃森 James Watson / 弗朗西斯·克里克 Francis Crick", c:"mol", lv:1, d:"单页 Nature 论文，结构本身即暗示复制机制：'它没有逃过我们的眼睛……'。弗兰克林与威尔金斯的 X 射线衍射数据是关键证据。分子生物学时代从此开始。", wiki:"https://en.wikipedia.org/wiki/Double_helix", wzh:"DNA双螺旋结构", g:`Photo 51——那张揭示双螺旋的X射线衍射图，出自罗莎琳德·弗兰克林的实验室，被同事威尔金斯未经同意拿给沃森看。弗兰克林在1962年诺奖评审前死于卵巢癌（38岁），诺奖不授死者。沃森晚年回忆录对她多有贬损，直到近年才被正式正名。`},
{y:1958, n:"半保留复制/中心法则", w:"梅塞尔森 Meselson / 斯塔尔 Stahl / 克里克 Crick", c:"mol", lv:2, d:"梅塞尔森-斯塔尔用重氮标记证明 DNA 半保留复制（'生物学最美的实验'）；克里克同年提出中心法则：DNA→RNA→蛋白质。", wiki:"https://en.wikipedia.org/wiki/Meselson–Stahl_experiment", wzh:"梅塞尔森-斯塔尔实验"},
{y:1961, n:"操纵子模型", w:"弗朗索瓦·雅各布 François Jacob / 雅克·莫诺 Jacques Monod", c:"mol", lv:2, d:"乳糖操纵子揭示基因表达的开关机制——基因可被调控。mRNA 概念同年提出。1965 年诺贝尔奖。", wiki:"https://en.wikipedia.org/wiki/Lac_operon", wzh:"乳糖操纵子"},
{y:1962, n:"叶绿体与线粒体起源", w:"早期内共生假说", c:"div", lv:2, d:"电镜与生化证据让'叶绿体、线粒体来自被吞噬的细菌'重新进入视野——为 1967 年马古利斯系统论证奠基。", wiki:"https://en.wikipedia.org/wiki/Endosymbiotic_theory", wzh:"内共生学说"},

const CAT_COLOR = {cell:"var(--cell)", gen:"var(--genetics)", mol:"var(--molecule)",
                   evo:"var(--evolution)", div:"var(--diversity)", fro:"var(--frontier)"};
const CAT_NAME  = {cell:"细胞篇", gen:"遗传与变异篇", mol:"分子与基因组", evo:"演化生物学",
                   div:"多样性与生态", fro:"前沿技术"};

const T0 = 1650, T1 = 2035;         // 数据年份范围
const PAD_L = 90, PAD_R = 130;      // 画布留白
const W = 17000;                      // 画布宽（px）
const x = y => PAD_L + (y - T0) / (T1 - T0) * (W - PAD_L - PAD_R);

const tl = document.getElementById("timeline");

// 世纪/年代刻度
for (let yr = 1660; yr <= 2030; yr += 20) {
  const t = document.createElement("div");
  t.className = "tick"; t.style.left = x(yr) + "px";
  const l = document.createElement("div");
  l.className = "tick-label"; l.style.left = x(yr) + "px"; l.textContent = yr;
  tl.appendChild(t); tl.appendChild(l);
}

// 时代分区
const ERAS = [
  [1650, 1800, "1665–1897：看到细胞"], [1800, 1900, "19世纪：细胞学说与遗传定律"],
  [1900, 1950, "1900–1950：染色体与基因"], [1950, 1975, "1950–1975：分子革命"],
  [1975, 2005, "1975–2005：基因组时代"], [2005, 2035, "2005–2026：编辑、AI 与前沿"]];
for (const [a, b, label] of ERAS) {
  const e = document.createElement("div");
  e.className = "era"; e.style.left = x(a) + "px";
  if (x(b) - x(a) < 220) e.style.display = "none";
  e.textContent = label; tl.appendChild(e);
}

// 事件密度谱：固定宽度导航条，每 20 年一格，点击某格缩放至该段
(function density(){
  const bins = {};
  EVENTS.forEach(ev => { const b = Math.floor(ev.y / 20) * 20; bins[b] = (bins[b] || 0) + 1; });
  const maxD = Math.max(...Object.values(bins));
  window._density = { bins, maxD };   // 供高亮函数复用
  const di = document.getElementById("densityInner");
  const Y0 = 1660, Y1 = 2040;   // 密度谱年份范围（首格起点 ~ 末格终点）
  for (let b = 1660; b <= 2020; b += 20) {
    const n = bins[b] || 0;
    const blk = document.createElement("div");
    blk.className = "bin";
    blk.dataset.year = b;
    blk.style.left = ((b - Y0) / (Y1 - Y0) * 100) + "%";
    blk.style.width = ((20 / (Y1 - Y0) * 100) - 0.5) + "%";
    if (n > 0) {
      const L = 92 - (n / maxD) * 40;   // 密度1≈浅橙，密度12≈深橙
      blk.style.background = `hsl(26, 66%, ${L}%)`;
      blk.title = `${b}–${b + 19}：${n} 个事件（点击缩放到此）`;
    } else {
      blk.style.background = "#eeeae3";   // 无事件：浅灰底色
      blk.title = `${b}–${b + 19}：无事件（点击缩放到此）`;
    }
    const yl = document.createElement("span");
    yl.className = "y";
    yl.textContent = b;
    blk.appendChild(yl);
    blk.addEventListener("click", () => zoomToEra(b));
    di.appendChild(blk);
  }
})();

// 布局：两侧行分配器——按年份顺序，轮流试上侧/下侧，放入“行的右边界放得下”的最浅行
const CARD_W = 210, GAP = 160;   // 卡宽与最小水平净间距（卡间不重叠）
const bounds = {1: [], "-1": []};  // side -> 每行右边界 px
function tryPlace(px, side) {
  const rs = bounds[side];
  for (let r = 0; r <= rs.length; r++) {
    const rb = rs[r] !== undefined ? rs[r] : -Infinity;
    if (px - rb >= CARD_W / 2 + GAP) return r;
  }
  return -1;
}
const placed = EVENTS.slice().sort((a, b) => a.y - b.y).map((ev, i) => {
  const px = x(ev.y);
  // 偶数事件优先上侧、奇数优先下侧（自然交替），放不下才加深；side 字段可强制指定侧
  const first = ev.side !== undefined ? ev.side : (i % 2 === 0 ? 1 : -1);
  let side = first, row = tryPlace(px, side);
  if (row < 0) { side = -first; row = tryPlace(px, side); }
  if (row < 0) { // 两侧都放不下：加深优先侧
    side = first; row = bounds[side].length;
  }
  bounds[side][row] = Math.max(bounds[side][row] !== undefined ? bounds[side][row] : -Infinity, px + CARD_W / 2);
  return {...ev, side, row};
});

for (const ev of placed) {
  const el = document.createElement("div");
  el.className = "event " + (ev.side > 0 ? "up" : "dn");
  el.style.left = x(ev.y) + "px";
  el.style.top = "45%";
  el.style.color = CAT_COLOR[ev.c];
  el.style.height = "0";           // 锚定中线，stem/card 绝对定位展开

  const stemLen = (ev.lv === 1 ? 32 : 20) + ev.row * 70;   // 初始行距70；渲染后再按实测卡高微调
  const stem = document.createElement("div");
  stem.className = "stem";
  stem.style.height = stemLen + "px";
  if (ev.side > 0) stem.style.bottom = "0"; else stem.style.top = "0";

  const dot = document.createElement("div");
  dot.className = "dot";
  const dsz = ev.lv === 1 ? 15 : 10;
  dot.style.width = dot.style.height = dsz + "px";
  dot.style.top = ev.side > 0 ? (-stemLen) + "px" : stemLen + "px";

  const card = document.createElement("div");
  card.className = "card";
  if (ev.side > 0) {
    card.style.top = "auto";
    card.style.bottom = (stemLen + 6) + "px";
  } else {
    card.style.top = (stemLen + 6) + "px";
  }
  card.innerHTML = `<div class="name">${ev.g ? "📖 " : ""}${ev.n}</div><div class="meta">${ev.w} · ${ev.y}</div>`;

  const det = document.createElement("div");
  det.className = "detail";
  det.style.display = "none";
  det.innerHTML = `<h3>${ev.n}</h3><div class="who">${ev.w} · ${ev.y} · ${CAT_NAME[ev.c]}${ev.lv===1?" · 里程碑":""}</div><p>${ev.d}</p>` +
    (ev.g ? `<div class="gossip"><div class="gtag">📖 一则八卦</div>${ev.g}</div>` : "") +
    (ev.wiki ? `<div class="src">扩展阅读：<a href="${ev.wiki}" target="_blank" rel="noopener">Wikipedia</a></div>` : "");
  // 详情卡初值：远离轴；渲染后统一做视口边界翻转
  if (ev.side > 0) {
    det.style.bottom = (stemLen + 70) + "px"; det.style.top = "auto";
  } else {
    det.style.top = (stemLen + 70) + "px"; det.style.bottom = "auto";
  }

  el.dataset.lv = ev.lv;
  el.dataset.row = ev.row;
  el.append(stem, dot, card, det);
  tl.appendChild(el);
}

// ===== 渲染后二次布局：按各行实测卡高收紧行距，防止溢出视口 =====
(function tighten(){
  const els = [...document.querySelectorAll('.event')];
  // 每侧每行的 [最高卡高]
  const rowH = {up: [], dn: []};
  els.forEach(el=>{
    const side = el.classList.contains('up') ? 'up' : 'dn';
    const row = +el.dataset.row;
    const h = el.querySelector('.card').offsetHeight;
    rowH[side][row] = Math.max(rowH[side][row] || 0, h);
  });
  // 各行累计偏移（含 10px 净距）
  const offset = {up: [], dn: []};
  ['up','dn'].forEach(sd => {
    let acc = 0;
    rowH[sd].forEach((h, r) => { offset[sd][r] = acc; acc += h + 6; });
  });
  els.forEach(el=>{
    const side = el.classList.contains('up') ? 'up' : 'dn';
    const row = +el.dataset.row;
    const lv = +el.dataset.lv;
    const stemLen = (lv === 1 ? 30 : 18) + offset[side][row];
    el.querySelector('.stem').style.height = stemLen + 'px';
    el.querySelector('.dot').style.top = (side === 'up' ? -stemLen : stemLen) + 'px';
    const card = el.querySelector('.card');
    if (side === 'up') { card.style.bottom = (stemLen + 6) + 'px'; }
    else { card.style.top = (stemLen + 6) + 'px'; }
  });
})();

// ===== 详情卡：钉住式 tooltip（悬停弹出后固定，可移入点击链接） =====
(function tooltip(){
  const tip = document.createElement('div');
  tip.id = 'detailTip';
  document.body.appendChild(tip);
  let activeEv = null;

  function place(e, evEl){
    // 优先放在事件点旁边（不跟鼠标），避让视口
    const r = evEl.querySelector('.dot').getBoundingClientRect();
    const w = 300, h = tip.offsetHeight || 150;
    let x = r.right + 18, y = r.top - 40;
    if (x + w > innerWidth - 12) x = r.left - w - 18;
    if (x < 12) x = 12;
    if (y + h > innerHeight - 12) y = innerHeight - h - 12;
    if (y < 12) y = 12;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseover', e => {
    const ev = e.target.closest('.event');
    if (ev === activeEv) return;
    if (ev) {
      activeEv = ev;
      tip.innerHTML = ev.querySelector('.detail').innerHTML;
      tip.style.color = getComputedStyle(ev).color;
      tip.style.display = 'block';
      place(e, ev);
    } else if (!tip.contains(e.target)) {
      // 移到别处（非当前事件、非 tip 内）→ 关闭
      tip.style.display = 'none';
      activeEv = null;
    }
  });
  // 拖动平移时关闭 tip，避免停在旧位置
  window.hideTip = () => { tip.style.display = 'none'; activeEv = null; };
})();

// ===== 交互：地图式缩放（先全景 → 滚轮 zoom → 拖动平移）=====
const vp = document.getElementById("viewport");
const stage = document.getElementById("stage");

let view = { s: 1, tx: 0, ty: 0 };
let minScale = 0.05;
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function apply(){
  stage.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.s})`;
  highlightDensity();
  updateStats();
}

// 更新可视区间与事件数量统计
function updateStats(){
  const [y0, y1] = currentYears();
  const y0c = Math.max(1665, Math.round(y0));
  const y1c = Math.min(2026, Math.round(y1));
  const cnt = EVENTS.filter(ev => ev.y >= y0 && ev.y <= y1).length;
  const st = document.getElementById('viewStats');
  if (st) {
    st.innerHTML = `可视区间 <b>${y0c}–${y1c}</b> · 事件 <b>${cnt}</b>`;
  }
}

// 当前视口覆盖的年份范围
function currentYears(){
  const cx0 = (0 - view.tx) / view.s;                    // 视口左边缘在画布上的 x
  const cx1 = (vp.clientWidth - view.tx) / view.s;       // 视口右边缘在画布上的 x
  const y0 = T0 + (cx0 - PAD_L) / (W - PAD_L - PAD_R) * (T1 - T0);
  const y1 = T0 + (cx1 - PAD_L) / (W - PAD_L - PAD_R) * (T1 - T0);
  return [y0, y1];
}

// 高亮当前视口覆盖的密度谱格（直接加深背景色，不依赖 filter）
function highlightDensity(){
  const [y0, y1] = currentYears();
  const { bins, maxD } = window._density;
  document.querySelectorAll('#densityInner .bin').forEach(bin => {
    const b = +bin.dataset.year;
    const active = (b + 20 >= y0 && b <= y1);
    bin.classList.toggle('active', active);
    const n = bins[b] || 0;
    if (n > 0) {
      const base = 92 - (n / maxD) * 40;
      bin.style.background = `hsl(26, 66%, ${active ? base - 9 : base}%)`;
    } else {
      bin.style.background = active ? "#dcd6ca" : "#eeeae3";
    }
  });
}

// 点击密度谱某格：缩放至该时间段（该 20 年占视口约 62%，垂直居中）
function zoomToEra(b){
  const w20 = x(b + 20) - x(b);
  const targetS = (vp.clientWidth * 0.62) / w20;
  view.s = clamp(targetS, minScale, 3.5);
  const yc = b + 10;
  view.tx = vp.clientWidth / 2 - x(yc) * view.s;
  view.ty = vp.clientHeight * 0.5 - vp.clientHeight * 0.45 * view.s;
  apply();
}

// 初始/重置：全景视图（横向 fit 全部 1665–2026）
function fitToView(){
  const pad = 40, vw = vp.clientWidth, vh = vp.clientHeight;
  minScale = Math.max(0.02, (vw - pad * 2) / W);
  view.s = minScale;
  view.tx = pad;
  view.ty = vh * 0.5 - vh * 0.45 * view.s;   // 主轴(45%)落在视口垂直中心
  apply();
}
fitToView();
window.addEventListener("resize", fitToView);
document.getElementById("resetBtn").addEventListener("click", fitToView);

// 滚轮缩放（以鼠标位置为焦点）
vp.addEventListener("wheel", e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  const ns = clamp(view.s * f, minScale, 3.5);
  const k = ns / view.s;
  view.tx = e.clientX - (e.clientX - view.tx) * k;
  view.ty = e.clientY - (e.clientY - view.ty) * k;
  view.s = ns;
  apply();
}, { passive: false });

// 拖动平移
let dragging = false, sx = 0, sy = 0, oTx = 0, oTy = 0, moved = false;
vp.addEventListener("mousedown", e => {
  dragging = true; moved = false;
  sx = e.clientX; sy = e.clientY; oTx = view.tx; oTy = view.ty;
  vp.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; if (window.hideTip) window.hideTip(); }
  view.tx = oTx + dx; view.ty = oTy + dy;
  apply();
});
window.addEventListener("mouseup", () => { dragging = false; vp.classList.remove("dragging"); });

// 触屏：单指平移，双指捏合缩放
let ts = null;
vp.addEventListener("touchstart", e => {
  if (e.touches.length === 1) ts = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: view.tx, ty: view.ty };
  else if (e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; ts = { d: Math.hypot(dx, dy), s: view.s }; }
}, { passive: true });
vp.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && ts && ts.x !== undefined) {
    view.tx = ts.tx + (e.touches[0].clientX - ts.x); view.ty = ts.ty + (e.touches[0].clientY - ts.y); apply();
  } else if (e.touches.length === 2 && ts && ts.d) {
    const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
    view.s = clamp(ts.s * (Math.hypot(dx, dy) / ts.d), minScale, 3.5); apply();
  }
}, { passive: true });

// 提示条自动淡出
setTimeout(() => { const h = document.getElementById("hint"); h.style.opacity = 0; }, 6000);
</script>
